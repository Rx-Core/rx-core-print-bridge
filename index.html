<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Rx Core print bridge</title>
<style>
  :root{--ink:#14202B;--ink2:#4B5966;--line:#D6DDE4;--ok:#25704A;--okbg:#E1F2E8;--err:#B42318;--errbg:#FBE9E7;--info:#2F5F98;--infobg:#E4EDF8;--accent:#0E6A73}
  @media (prefers-color-scheme:dark){:root{--ink:#E6EDF3;--ink2:#A9B6C2;--line:#2A3743;--okbg:#173626;--errbg:#3B1A16;--infobg:#17283D}body{background:#0F171E}}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#F3F5F7}
  main{max-width:560px;margin:40px auto;padding:0 16px}
  h1{font-size:20px;margin:0 0 4px} p{margin:6px 0;color:var(--ink2)}
  .card{background:Canvas;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}
  .msg{padding:10px 12px;border-radius:6px;margin-top:12px}
  .ok{background:var(--okbg);color:var(--ok)} .err{background:var(--errbg);color:var(--err)} .info{background:var(--infobg);color:var(--info)}
  button,a.btn{display:inline-block;font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:Canvas;color:var(--ink);cursor:pointer;text-decoration:none;margin:10px 8px 0 0}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  code{font-size:12.5px}
</style>
</head>
<body>
<main>
  <h1>Rx Core print bridge</h1>
  <p>Hands labels from Rx Core to Zebra Browser Print on this computer. It stores nothing and sends nothing anywhere except to Browser Print on this computer.</p>
  <div class="card"><div id="what">Checking for a print job…</div><div id="status" class="msg info" role="status">Starting…</div><div id="actions"></div></div>
</main>
<script>
"use strict";
const BASES=["https://localhost:9101","http://localhost:9100"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setStatus(kind,text){ const el=$("status"); el.className="msg "+kind; el.textContent=text; }
function setActions(html){ $("actions").innerHTML=html; }
/* Read the job from the address fragment (never sent to a server), then remove it from the address bar and history entry. */
function validJob(j){ if(!j||typeof j.zpl!=="string"||!/^\s*\^XA/.test(j.zpl)||!/\^XZ\s*$/.test(j.zpl)||j.zpl.length>60000) throw new Error("not a ZPL label"); return j; }
function readJob(){ const h=location.hash.replace(/^#/,""); if(h==="wait"){ history.replaceState(null,"",location.pathname+location.search); return null; } if(!h.startsWith("job=")) return null;
  history.replaceState(null,"",location.pathname+location.search);
  try{ const b64=h.slice(4).replace(/-/g,"+").replace(/_/g,"/"); const json=decodeURIComponent(escape(atob(b64))); return validJob(JSON.parse(json)); }catch(e){ return {invalid:String(e.message||e)}; } }
/* If the link arrived without the label, ask the Rx Core tab that opened this one to send it directly. */
function askOpener(ms){ return new Promise(res=>{ if(!window.opener){ res(null); return; } let done=false;
  /* Only the tab that opened this page may hand over a label, and the result goes back to that tab's origin only. */
  const on=e=>{ const m=e.data; if(e.source!==window.opener) return; if(m&&m.type==="rxcore-print-job"){ replyOrigin=e.origin&&e.origin!=="null"?e.origin:"*"; try{ const j=validJob(m.job); done=true; window.removeEventListener("message",on); res(j); }catch(err){} } };
  window.addEventListener("message",on); try{ window.opener.postMessage({type:"rxcore-bridge-ready"},"*"); }catch(e){}
  setTimeout(()=>{ if(!done){ window.removeEventListener("message",on); res(null); } },ms); }); }
async function bp(path,init,ms){ const tries=[];
  for(const base of BASES){ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms||4000);
    try{ const r=await fetch(base+"/"+path,{...init,signal:ctl.signal}); clearTimeout(t); const text=await r.text(); if(!r.ok) throw Object.assign(new Error(`Browser Print answered ${r.status}: ${text.slice(0,160)}`),{answered:true}); return text; }
    catch(e){ clearTimeout(t); if(e.answered) throw e; tries.push(`${base}: ${e.name==="AbortError"?"no answer":e.message}`); } }
  throw Object.assign(new Error("Could not reach Zebra Browser Print."),{tries}); }
async function defaultPrinter(){ const t=await bp("default?type=printer",{method:"GET"}); if(!t.trim()) throw new Error("Browser Print is running but has no default printer. Open Browser Print and choose the ZD411."); return JSON.parse(t); }
/* A job may name its printer (part of the name, e.g. "ZD421") so different labels go to different printers. */
async function pickPrinter(name){ if(!name) return defaultPrinter(); const t=await bp("available",{method:"GET"}); let list=[]; try{ const j=JSON.parse(t); list=Array.isArray(j)?j:(j.printer||[]); }catch(e){}
  const want=String(name).toLowerCase(); const d=list.find(x=>String(x.name||"").toLowerCase().includes(want));
  if(!d) throw new Error(`Browser Print has no printer whose name contains "${name}". Printers it can see: ${list.map(x=>x.name).join(", ")||"none"}.`); return d; }
async function send(zpl,printer){ const device=await pickPrinter(printer); await bp("write",{method:"POST",body:JSON.stringify({device,data:zpl})},10000); return device; }
let replyOrigin="*"; /* a job from the link carries no patient information and names no origin; its result holds only the job id and printer name */
function report(msg){ try{ if(window.opener) window.opener.postMessage({type:"rxcore-print-result",...msg},replyOrigin); }catch(e){} }
function explain(e){ const safari=/^((?!chrome|chromium|crios|edg|android).)*safari/i.test(navigator.userAgent);
  let t=e.message||String(e); if(e.tries) t+=" "+(safari?"Safari connects only after you trust Browser Print's local certificate (button below). ":"Check that Browser Print is running (menu bar icon) and that it allowed this site. ")+"Details: "+e.tries.join(" · ");
  return t; }
const helpButtons=`<a class="btn" href="https://localhost:9101/ssl_support" target="_blank" rel="noopener">Trust Browser Print certificate</a>`;
const TEST_ZPL="^XA^CI28^PW406^LL203^FO20,30^A0N,34,30^FDRx Core print bridge^FS^FO20,80^A0N,24,22^FDTest label^FS^FO20,115^A0N,20,18^FD"+new Date().toLocaleString()+"^FS^PQ1^XZ";
async function run(job){
  setStatus("info","Sending to Zebra Browser Print…"); setActions("");
  try{ const dv=await send(job.zpl,job.printer); setStatus("ok",`Printed on ${dv.name||"the default printer"}.`); report({jobId:job.jobId,ok:true,printer:dv.name||""});
    if(job.jobId){ setActions(`<button id="close" class="primary">Close this tab</button>`); $("close").onclick=()=>window.close(); setTimeout(()=>window.close(),1500); } }
  catch(e){ setStatus("err",explain(e)); report({jobId:job.jobId,ok:false,error:e.message||String(e)}); setActions(`<button id="retry" class="primary">Try again</button>${helpButtons}`); $("retry").onclick=()=>run(job); } }
function idle(){ $("what").innerHTML="No label was sent. Open this page from Rx Core's Print button, or check the printer connection here.";
  setStatus("info","Ready."); setActions(`<button id="chk">Check printer connection</button><button id="test">Print a test label</button>${helpButtons}`);
  $("chk").onclick=async()=>{ setStatus("info","Checking…"); try{ const dv=await defaultPrinter(); setStatus("ok",`Connected to ${dv.name||"the default printer"}${dv.connection?` (${dv.connection})`:""}.`); }catch(e){ setStatus("err",explain(e)); } };
  $("test").onclick=()=>run({zpl:TEST_ZPL}); }
function start(job){ $("what").innerHTML=`<b>${esc(job.title||"Label")}</b>${job.copies?` · ${esc(job.copies)} label${job.copies==1?"":"s"}`:""}`; run(job); }
(async()=>{ const job=readJob();
  if(job&&job.invalid){ $("what").textContent="The link did not contain a valid label."; setStatus("err",job.invalid); return; }
  if(job){ start(job); return; }
  if(window.opener){ setStatus("info","Getting the label from Rx Core…"); const j=await askOpener(3000); if(j){ start(j); return; } }
  idle(); })();
</script>
</body>
</html>
